server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed build assets are immutable — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unmatched path (client-side route) serves index.html
    # rather than a 404, so a hard refresh on e.g. /patient/<id> still works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
