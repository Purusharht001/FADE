[project]
name = "fade-backend"
version = "0.1.0"
description = "FADE — Fuzzy-Assisted Diagnostic Evaluator for Dementia Staging. Backend API: MRI preprocessing/volumetry pipeline, Mamdani fuzzy inference engine, and clinician-facing REST API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "pyjwt[crypto]==2.13.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "nibabel==5.4.2",
    "numpy==2.5.2",
    "scipy==1.18.0",
    "scikit-image==0.26.0",
    "structlog==26.1.0",
    "slowapi==0.1.10",
    "email-validator==2.3.0",
    # Imported directly by app/middleware/logging.py. Previously relied on
    # FastAPI pulling it in transitively; declared explicitly so a FastAPI
    # bump cannot silently remove it. (Phase 0 dependency audit.)
    "starlette==1.6.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.3",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic revision files are machine-generated; formatting them by hand
# produces churn on every autogenerate. env.py and script.py.mako are
# Alembic's own templates. Excluded from lint, not from type checking.
extend-exclude = ["alembic/versions", "alembic/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
